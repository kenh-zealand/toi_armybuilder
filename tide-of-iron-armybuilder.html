      <b>What is real:</b> the unit list is split three ways. <b style="color:var(--ok)">In the game</b> = a physical component or an official unit card. <b style="color:var(--brass)">House rule</b> = added by this project for breadth (like a Warhammer list) — not in the box. <b style="color:var(--oxide)">Fan</b> = from the unofficial Tail of the Dragon. Doctrines, points and order of battle are all house rules; ToI has none of them officially. ToI also has no on-board field artillery — artillery is off-board via Strategy cards and is not part of this points system.<br><br>

      <b>Figures:</b> Regular 5 · Elite 9 · Officer 13 · MG team 17 · Mortar team 21.

      <tr><td>Regular Infantry</td><td class="mono" style="font-size:13px">${FIG.regular.stat}</td><td class="src">Base</td><td class="num">5</td></tr>

      </tbody></table></div>`;
  }

  h += `<section><h2>Anti-tank guns &amp; equipment — movement and handling</h2>
    <p class="lead">Every anti-tank gun (and the 88 / ZiS-3 dual-purpose gun) has the <b>Equipment</b> trait. An equipment unit has <b>no crew of its own</b> and can do nothing on its own — it always needs a friendly unit in its space. Rules below are consolidated from Days of the Fox and Fury of the Bear.</p>

    <div class="callout"><b>Manning &amp; firing</b><br>
      A <b>Concentrated Fire</b> or <b>Prepare Op Fire</b> action with the gun needs a friendly <b>squad</b> — fresh or in Op Fire mode — in the same space; firing the gun does <i>not</i> activate that squad, and the gun can join combined fire like any unit. On Op Fire the gun itself is fatigued, then follows the normal opportunity-fire rules. A <b>pinned</b> squad may still fire the gun at <b>half firepower</b> if a friendly officer is in the space. The gun <b>cannot be activated at all</b> while it — or the manning unit — is pinned, disrupted, heavily damaged, or inside a pillbox, bunker or trench. An equipment unit may <b>never</b> perform Fire &amp; Movement or Assault.</div>

    <div class="callout" style="margin-top:9px"><b>Moving with the crew alone (no vehicle)</b><br>
      The gun moves with an <b>Advance</b> action, and only if a <b>fresh friendly unit</b> is in its space. Fatigue both the friendly unit and the gun and move both together into one adjacent space free of enemy units — this is a <b>single action</b>. The gun moves <b>exactly one space, regardless of terrain</b>; it may not enter an impassable space or one that already holds two or more units, and any obstacle (e.g. a minefield) in the destination triggers as normal. A squad sitting <b>in an entrenchment</b> (not a pillbox/trench) may still work the gun, and the gun gains <b>+1 cover</b> from being with an entrenchment — but none from a pillbox or trench.</div>

    <div class="callout" style="margin-top:9px"><b>Moving by vehicle — the optional "limber / tow" rule (Days of the Fox)</b><br>
      <b>Load:</b> give the gun an <b>Advance</b> action to load onto a transport vehicle; the vehicle, the gun and a <b>fresh friendly squad</b> must all begin that action in the same space.<br>
      <b>Carry:</b> the gun then rides with the vehicle at normal vehicle movement. It does <b>not</b> count against the vehicle's transport capacity, but a vehicle may carry <b>only one</b> gun at a time (on top of any squads it is transporting).<br>
      <b>Unload:</b> give the gun an <b>Advance</b> action to leave the vehicle, with a <b>fresh friendly squad</b> in the space. The gun is <b>fatigued</b> on unloading, so it <b>cannot fire that turn</b> — deploy it the turn before you need it.<br>
      <b>Tow pairings (guideline):</b> half-tracks tow the heavy guns (8.8 cm Flak); Bren Carriers only the light guns (M1 57 mm, QF 6-pdr); trucks tow the light / medium guns. Scenario special rules may override this.</div>

    <div class="callout" style="margin-top:9px"><b>Combat &amp; capture</b><br>
      <b>Fragile:</b> a heavily damaged AT gun is destroyed immediately. <b>Concussive Firepower:</b> vs a squad in a building or pillbox the gun gets <b>+3 firepower and +3 range</b>. When <b>assaulted</b>, the gun adds no dice, takes no hits and does not retreat, but it still counts toward the space's unit limit. <b>Capture:</b> if an enemy unit is in the gun's space, the gun counts as <i>their</i> unit and they may advance and fire it under these same rules; an equipment unit alone in a space does <b>not</b> block enemy movement into it.</div>

    <p class="lead" style="margin-top:10px"><b>Transporting squads</b> is separate: a squad embarks or disembarks a Transport-trait vehicle for <b>2 MP</b> as part of its move, up to the vehicle's capacity (trucks 2, half-tracks / carriers 1). A transported squad can't act while aboard, and if the vehicle is destroyed the squad goes with it.</p>

    <p class="lead" style="margin-top:6px; font-size:12.5px">In this builder a gun costs its listed points with <b>no crew to buy</b> — man it with any squad in play. Points assume you keep a squad with it.</p>
  </section>`;

  h += `<section><h2>Fortifications &amp; obstacles</h2>
    <div class="tablewrap"><table class="ref"><thead><tr><th>Element</th><th>Effect</th><th>Source</th><th class="num">Pts</th></tr></thead><tbody>
    ${refRows(FORTS, 'v')}
    </tbody></table></div>
    <p class="lead" style="margin-top:8px">Available only in scenarios that allow it (see the table below). Free entrenchments from the scenario cost no points.</p>
  </section>`;

  h += `<section><h2>Scenarios</h2>
    <p class="lead">The builder starts from classic board-wargame scenarios (Bolt Action, Flames of War and similar). The scenario sets the effective points (attacker / defender), whether fortification is allowed, how large a reserve starts off the board, plus deployment and victory conditions — and it drives the order-of-battle checklist.</p>
    <div class="tablewrap"><table class="ref"><thead><tr>
      <th>Scenario</th><th>Type</th><th>Role</th><th class="num">Points</th><th class="num">Fortif.</th><th class="num">Reserve</th><th>Victory</th>
    </tr></thead><tbody>
    ${SCENARIOS.map(s=>{
      const rows = s.asym ? [['Attacker', s.attacker],['Defender', s.defender]] : [['Both', s]];
      return rows.map((r,i)=>`<tr>
        ${i===0?`<td rowspan="${rows.length}"><b>${s.name}</b></td><td rowspan="${rows.length}" class="src">${s.src}</td>`:''}
        <td>${r[0]}</td>
        <td class="num">${r[1].mult? (r[1].mult>1?'+':'')+Math.round((r[1].mult-1)*100)+'%' : '100%'}</td>
        <td class="num">${r[1].fort? Math.round(r[1].fort*100)+'%'+(r[1].freeEntrench?` +${r[1].freeEntrench}`:'') : '—'}</td>
        <td class="num">${r[1].reserves? Math.round(r[1].reserves*100)+'%':'—'}</td>
        ${i===0?`<td rowspan="${rows.length}" style="font-size:13px">${s.vc}</td>`:''}
      </tr>`).join('');
    }).join('')}
    </tbody></table></div>
  </section>`;

  h += `<section><h2>Order of battle</h2>
    <div class="grid2">
      <div class="callout"><b>Mandatory</b><br>1 × command squad<br>2 × infantry / weapon squad</div>
      <div class="callout"><b>Per 250 pts of the limit — up to</b><br>+2 infantry / weapon squads<br>+1 vehicle · +1 gun / emplacement</div>
      <div class="callout"><b>Transport</b><br>1 per infantry squad. Assigned to the squad — does not use a vehicle slot.</div>
      <div class="callout"><b>Caps</b><br>Heavy tanks: 1 per 750 pts (Germany 1 per 500).<br>No single unit over ⅓ of the limit.<br>Specialized squads: half of your squads, rounded up.</div>
    </div>
  </section>`;

  h += `<section><h2>Sources</h2>
    <p class="lead">Unit lists and component overviews were checked against:</p>
    <ul style="font-size:13.5px; color:var(--ink-soft); line-height:1.75; max-width:74ch">
      <li>Fantasy Flight Games rulebooks (incl. <i>Fury of the Bear</i> and <i>Normandy</i> — component lists and unit cards)</li>
      <li>1A Games: <i>Next Wave</i> Rules of Play, <i>Tools of War</i>, and the Kickstarter bonus booklet</li>
      <li>The fan site <b>commandsandcolors.net/tideofiron</b> — component overviews per expansion</li>
      <li>BoardGameGeek component lists for each release</li>
      <li>Universal Head / Order of Gamers player aid v4 (core game + Days of the Fox + Normandy)</li>
    </ul>
    <p class="lead">Doctrines, points, order of battle and scenario modifiers are this project’s own house rules.</p>
  </section>`;

  h += `<section><h2>Version history</h2>
    <p class="lead">Version <b>1.N</b>, where <b>N</b> is the number of revisions since the first release. Currently <b>v${APP_VERSION}</b>.</p>
    <div class="tablewrap"><table class="ref"><thead><tr><th class="num">Version</th><th>Change</th></tr></thead><tbody>
    ${CHANGELOG.slice().reverse().map(r=>`<tr><td class="num">v${r[0]}</td><td style="font-size:13px">${r[1]}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;

  el.innerHTML = h;
}

/* =====================================================================

function switchView(v){
  const views = { build:'#view-build', review:'#view-review', comp:'#view-comp' };
  for(const [k,sel] of Object.entries(views)) $(sel).hidden = (k!==v);
  $('#tab-build').setAttribute('aria-selected', v==='build');
  $('#tab-review').setAttribute('aria-selected', v==='review');
  $('#tab-comp').setAttribute('aria-selected', v==='comp');
  if(v==='comp') buildCompendium();
  if(v==='review') buildReview();
  window.scrollTo({top:0, behavior:'instant'});
}
$('#tab-build').onclick = ()=> switchView('build');
$('#tab-review').onclick = ()=> switchView('review');
$('#tab-comp').onclick = ()=> switchView('comp');

$('#nationSel').onchange = e=>{
  state.nation = e.target.value;
  ensureNationColls();
  state.items = state.items.filter(i=> findDef(i.defId));
  if(!state.items.some(i=>findDef(i.defId)?.kind==='command')) add(state.nation+'_cmd');
  render();
};
$('#limitSel').onchange = e=>{
  if(e.target.value==='custom'){ $('#customWrap').hidden = false; state.limit = +$('#customLimit').value||700; }
  else { $('#customWrap').hidden = true; state.limit = +e.target.value; }
  render();
};
$('#customLimit').oninput = e=>{ state.limit = Math.max(100, +e.target.value||700); render(); };
$('#listName').oninput = e=>{ state.name = e.target.value; };
$('#scenarioSel').onchange = e=>{
  state.scenario = e.target.value;
  if(!scenByKey(state.scenario).asym) state.role = 'attacker';
  if(state.cat==='fort' && sctx().fort<=0) state.cat = 'infantry';
  render();
};
$('#roleSel').onchange = e=>{ state.role = e.target.value; render(); };

$('#btnAuto').onclick = confirmAuto;
$('#btnSave').onclick = doSave;
$('#btnLoad').onclick = doLoad;
$('#btnNew').onclick = doNew;
$('#btnReview').onclick = ()=> switchView('review');
$('#btnExport').onclick = ()=>{
  openDlg('Export force list',
    `<p style="font-size:13px;color:var(--ink-soft);margin-top:0">Plain-text list — select and copy. For a formatted PDF use <b>Review → Save as PDF</b>.</p>
     <textarea readonly id="expTA"></textarea>`);
  const t = $('#expTA'); if(t){ t.value = armyText(); }
};
$('#dlgClose').onclick = ()=> $('#dlg').close();
$('#dlg').addEventListener('close', ()=>{ $('#dlgBody').innerHTML=''; });

/* theme toggle */
const themeBtn = $('#themeBtn');
function curTheme(){ return document.documentElement.getAttribute('data-theme'); }
themeBtn.onclick = ()=>{
  const now = curTheme();
  const next = now==='dark' ? 'light' : now==='light' ? 'dark'
    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('toi-theme', next); }catch(e){}
};
try{ const t = localStorage.getItem('toi-theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}

$('#verBadge').textContent = 'v' + APP_VERSION;
$('#footNote').innerHTML = `<b>Tide of Iron · Battle Builder</b> <span class="mono">v${APP_VERSION}</span> — a fan-made, unofficial points and army-builder system for <i>Tide of Iron</i> (Fantasy Flight Games / 1A Games). Not affiliated with the rights holders. Saved lists live only in your own browser. Unit data from FFG / 1A rulebooks and commandsandcolors.net/tideofiron.`;

seedSample();
render();
</script>
