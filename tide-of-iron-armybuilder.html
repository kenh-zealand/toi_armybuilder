<title>Tide of Iron - Battle Builder</title>
<meta name="description" content="A fan-made, balanced points and army-builder system for Tide of Iron and every expansion, with a full unit compendium." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />

<style>
  :root{
    --ground:#E5E0D1; --paper:#FCFAF4; --paper-2:#F1EDE0; --sink:#DAD3BE;
    --ink:#1D1A13; --ink-soft:#413C2F; --ink-faint:#5F5847;
    --line:#CEC6AE; --line-strong:#B7AD8E;
    --olive:#454C2E; --olive-bright:#5E6A3C;
    --brass:#8A6A1E; --brass-soft:#efe6cf;
    --oxide:#973219;
    --ok:#43602E; --warn:#8A6111; --fail:#973219;
    --ok-bg:#e0e7d2; --warn-bg:#f0e6cd; --fail-bg:#f0dcd3;
    --shadow:0 1px 2px rgba(35,32,25,.10), 0 8px 24px rgba(35,32,25,.09);
    --radius:3px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#13150D; --paper:#1E211A; --paper-2:#282C21; --sink:#191C13;
    --ink:#F1ECDA; --ink-soft:#C4BDA6; --ink-faint:#978F76;
    --line:#3F4332; --line-strong:#555A44;
    --olive:#95A067; --olive-bright:#AEB980;
    --brass:#D3A954; --brass-soft:#342d19;
    --oxide:#DC7250;
    --ok:#9BBB73; --warn:#DBAA47; --fail:#DC7250;
    --ok-bg:#242a1a; --warn-bg:#2f2919; --fail-bg:#2e2018;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.30);
  }}
  :root[data-theme="dark"]{
    --ground:#13150D; --paper:#1E211A; --paper-2:#282C21; --sink:#191C13;
    --ink:#F1ECDA; --ink-soft:#C4BDA6; --ink-faint:#978F76;
    --line:#3F4332; --line-strong:#555A44;
    --olive:#95A067; --olive-bright:#AEB980;
    --brass:#D3A954; --brass-soft:#342d19;
    --oxide:#DC7250;
    --ok:#9BBB73; --warn:#DBAA47; --fail:#DC7250;
    --ok-bg:#242a1a; --warn-bg:#2f2919; --fail-bg:#2e2018;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.30);
  }

  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:15.5px; line-height:1.58; margin:0;
    text-rendering:optimizeLegibility;
  }
  h1,h2,h3,h4{font-family:"Barlow Condensed", "IBM Plex Sans", sans-serif; font-weight:700; margin:0; line-height:1.12; text-wrap:balance;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
  button{font-family:inherit; cursor:pointer}
  a{color:var(--olive-bright)}
  @media (max-width:640px){ body{font-size:16px} }

  .wrap{max-width:1220px; margin:0 auto; padding:0 20px 80px}

  /* ---- Masthead ---- */
  header.masthead{
    border-bottom:2px solid var(--olive);
    background:linear-gradient(180deg, var(--paper), var(--ground));
  }
  .masthead-inner{max-width:1220px; margin:0 auto; padding:18px 20px 14px; position:relative}
  .eyebrow{
    font-family:"Barlow Condensed",sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.16em; font-size:12.5px;
    color:var(--oxide);
  }
  h1.title{
    font-size:clamp(30px, 5vw, 46px); letter-spacing:.02em; text-transform:uppercase;
    margin:2px 0 5px;
  }
  .subtitle{color:var(--ink-soft); max-width:62ch; font-size:15px; line-height:1.6}
  .ver{display:inline-block; vertical-align:middle; margin-left:12px; position:relative; top:-5px;
    font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:400; letter-spacing:0; text-transform:none;
    color:var(--ink-faint); border:1px solid var(--line-strong); border-radius:2px; padding:2px 7px}
  .stencil-rule{height:6px; margin-top:12px; background:
    repeating-linear-gradient(90deg, var(--olive) 0 22px, transparent 22px 30px);
    opacity:.5}

  .modes{display:flex; gap:0; margin-top:16px; border:1px solid var(--line-strong); width:max-content; border-radius:var(--radius); overflow:hidden}
  .modes button{
    background:var(--paper); border:0; padding:8px 20px; color:var(--ink-soft);
    font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:14px;
  }
  .modes button + button{border-left:1px solid var(--line-strong)}
  .modes button[aria-selected="true"]{background:var(--olive); color:#F3EFE2}

  .theme-toggle{
    position:absolute; top:18px; right:20px;
    background:var(--paper); border:1px solid var(--line-strong); color:var(--ink-soft);
    border-radius:var(--radius); padding:6px 10px; font-size:12px; font-family:"Barlow Condensed",sans-serif;
    text-transform:uppercase; letter-spacing:.1em;
  }

  /* ---- Command bar ---- */
  .commandbar{
    display:flex; flex-wrap:wrap; gap:18px 26px; align-items:flex-end;
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin:22px 0; box-shadow:var(--shadow);
  }
  .field{display:flex; flex-direction:column; gap:5px}
  .field label{
    font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase;
    letter-spacing:.14em; font-size:11px; color:var(--ink-faint);
  }
  select, input[type=number], input[type=text]{
    font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:15px; color:var(--ink);
    background:var(--paper-2); border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:7px 9px;
  }
  input[type=number]{width:92px}
  .collbar{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:-8px 0 22px;
    padding:11px 14px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius)}
  .collbar-lbl{font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase;
    letter-spacing:.14em; font-size:11px; color:var(--ink-faint); margin-right:2px}
  .coll-chip{background:var(--paper-2); border:1px solid var(--line-strong); color:var(--ink-soft);
    border-radius:var(--radius); padding:5px 11px; font-family:"Barlow Condensed",sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.05em; font-size:12px; display:inline-flex; align-items:center; gap:6px}
  .coll-chip::before{content:""; width:11px; height:11px; border:1px solid currentColor; border-radius:2px; flex:none; opacity:.55}
  .coll-chip[aria-pressed="true"]{background:var(--olive); color:#F1EDDF; border-color:var(--olive)}
  .coll-chip[aria-pressed="true"]::before{background:#F1EDDF; opacity:1}
  .coll-chip.opt[aria-pressed="true"]{background:var(--brass); border-color:var(--brass); color:var(--paper)}
  .coll-chip.fan[aria-pressed="true"]{background:var(--oxide); border-color:var(--oxide); color:var(--paper)}
  .coll-chip:disabled{cursor:default}
  .coll-chip.all{border-style:dashed}
  .coll-chip.all::before{display:none}
  .doctrine{
    flex:1 1 320px; min-width:260px; border-left:3px solid var(--brass); padding-left:12px;
  }
  .doctrine b{font-family:"Barlow Condensed",sans-serif; letter-spacing:.02em; text-transform:uppercase; font-size:15px}
  .doctrine p{margin:2px 0 0; font-size:13.5px; color:var(--ink-soft)}
  .doctrine.briefing{border-left-color:var(--oxide)}
  .doctrine.briefing .vc{display:block; margin-top:5px; font-size:12.5px; color:var(--ink-soft)}
  .doctrine.briefing .orders{display:block; margin-top:5px; font-size:13px; color:var(--ink); font-weight:500}
  .gauge-sub{margin-top:6px; font-size:12px; color:var(--ink-soft); font-family:"IBM Plex Mono",monospace}

  /* ---- Builder grid ---- */
  .builder{display:grid; grid-template-columns:1fr 384px; gap:26px; align-items:start}
  @media (max-width:940px){ .builder{grid-template-columns:1fr} }

  /* ---- Arsenal ---- */
  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
  .tabs button{
    background:var(--paper); border:1px solid var(--line-strong); color:var(--ink-soft);
    padding:6px 12px; border-radius:var(--radius);
    font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.08em; font-size:12.5px;
  }
  .tabs button[aria-selected="true"]{background:var(--olive); color:#F3EFE2; border-color:var(--olive)}

  .cat-note{font-size:13.5px; color:var(--ink-soft); margin:-4px 0 8px; max-width:66ch}
  .statleg{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; padding:8px 11px;
    background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); max-width:70ch; line-height:1.55}
  .statleg b{color:var(--ink)}

  .unit{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:9px; display:grid;
    grid-template-columns:1fr auto; gap:4px 14px; align-items:start;
  }
  .unit h4{font-size:17.5px; letter-spacing:.01em}
  .unit .tag{
    display:inline-block; margin-left:8px; vertical-align:middle;
    font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:10px;
    text-transform:uppercase; letter-spacing:.1em; color:var(--ink-faint);
    border:1px solid var(--line-strong); border-radius:2px; padding:1px 5px;
  }
  .unit .tag.tag-ext{color:var(--brass); border-color:var(--brass)}
  .unit .tag.tag-fan{color:var(--oxide); border-color:var(--oxide)}
  .unit .stat{grid-column:1; font-size:13px; color:var(--ink-soft); letter-spacing:.01em}
  .unit .desc{grid-column:1; font-size:13px; color:var(--ink-soft); margin-top:3px; line-height:1.5}
  .unit .price{
    grid-row:1 / span 2; grid-column:2; text-align:right; align-self:center;
  }
  .unit .price .pts{font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:20px; color:var(--ink)}
  .unit .price .pts small{font-size:11px; color:var(--ink-faint)}
  .add-btn{
    margin-top:6px; background:var(--brass-soft); color:var(--brass);
    border:1px solid var(--brass); border-radius:var(--radius);
    padding:5px 12px; font-family:"Barlow Condensed",sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.08em; font-size:12px;
  }
  .add-btn:hover{background:var(--brass); color:var(--paper)}
  .add-btn:disabled{opacity:.4; cursor:not-allowed; background:var(--brass-soft); color:var(--brass)}

  /* ---- Specialization panel ---- */
  .spec-card{
    border:1px solid var(--line); border-left:3px solid var(--brass); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:9px; background:var(--paper);
  }
  .spec-card.has{border-left-color:var(--ok)}
  .spec-card h4{font-size:17px; text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
  .spec-card h4 .src{color:var(--ink-faint)}
  .spec-card p{margin:5px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.55}
  .spec-card .pt{font-family:"IBM Plex Mono",monospace; color:var(--brass); font-size:13px; font-weight:500}
  .spec-foot{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:9px}
  .spec-chip{
    background:var(--brass-soft); color:var(--brass); border:1px solid var(--brass);
    border-radius:2px; padding:2px 7px; font-size:11.5px;
    font-family:"Barlow Condensed",sans-serif; font-weight:600; letter-spacing:.03em;
  }

  /* ---- Roster ---- */
  .roster{position:sticky; top:14px}
  @media (max-width:940px){ .roster{position:static} }
  .roster-card{
    background:var(--paper); border:1px solid var(--line-strong); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .roster-head{background:var(--olive); color:#F1EDDF; padding:12px 15px}
  .roster-head input{
    background:transparent; border:0; border-bottom:1px dashed rgba(241,237,223,.5);
    color:#F1EDDF; font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:20px;
    text-transform:uppercase; letter-spacing:.03em; width:100%; padding:2px 0;
  }
  .roster-head input:focus{outline:none; border-bottom-color:#F1EDDF}

  .gauge{padding:12px 15px; border-bottom:1px solid var(--line)}
  .gauge-nums{display:flex; justify-content:space-between; align-items:baseline; font-family:"IBM Plex Mono",monospace}
  .gauge-nums .big{font-size:26px; font-weight:500}
  .gauge-nums .lim{font-size:13.5px; color:var(--ink-soft)}
  .bar{height:8px; background:var(--sink); border-radius:2px; margin-top:8px; overflow:hidden}
  .bar span{display:block; height:100%; background:var(--olive-bright); transition:width .18s}
  .bar span.over{background:var(--fail)}

  .checks{padding:10px 15px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px}
  .check{display:flex; gap:8px; align-items:baseline; font-size:13px; line-height:1.45}
  .check .dot{width:8px; height:8px; border-radius:50%; flex:none; position:relative; top:1px}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.fail{background:var(--fail)}
  .check.ok{color:var(--ink-soft)} .check.warn{color:var(--warn)} .check.fail{color:var(--fail)}

  .rlist{padding:6px 15px 14px; max-height:46vh; overflow-y:auto}
  @media (max-width:940px){ .rlist{max-height:none} }
  .rgroup-h{
    font-family:"Barlow Condensed",sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.1em; font-size:12px; color:var(--oxide);
    margin:13px 0 5px; padding-bottom:3px; border-bottom:1px solid var(--line);
  }
  .ritem{padding:8px 0; border-bottom:1px dotted var(--line)}
  .ritem-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .ritem-name{font-weight:600; font-size:14.5px}
  .ritem-cost{font-family:"IBM Plex Mono",monospace; font-size:14px; flex:none; font-weight:500}
  .ritem-cfg{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center}
  .slot{
    width:26px; height:26px; border:1px solid var(--line-strong); border-radius:2px;
    background:var(--paper-2); font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:13px;
    color:var(--ink-soft); display:flex; align-items:center; justify-content:center; padding:0;
  }
  .slot.rg{background:var(--paper-2)} .slot.el{background:#dfe6d0; color:var(--olive); border-color:var(--olive-bright)}
  .slot.of{background:var(--brass-soft); color:var(--brass); border-color:var(--brass)}
  .slot.em{opacity:.4}
  :root[data-theme="dark"] .slot.el, :root:not([data-theme="light"]) .slot.el{background:#2b331f}
  .ritem-cfg select{font-size:12.5px; padding:5px 6px; max-width:180px}
  .qty{display:flex; align-items:center; border:1px solid var(--line-strong); border-radius:2px; overflow:hidden}
  .qty button{background:var(--paper-2); border:0; width:24px; height:26px; font-size:15px; color:var(--ink-soft)}
  .qty span{width:30px; text-align:center; font-family:"IBM Plex Mono",monospace; font-size:13px}
  .x-btn{background:transparent; border:0; color:var(--fail); font-size:12px; font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.06em; padding:2px 4px}
  .mini-note{font-size:12.5px; color:var(--ink-faint); margin-top:3px; line-height:1.45}

  .roster-actions{padding:12px 15px; display:flex; flex-wrap:wrap; gap:7px; border-top:1px solid var(--line-strong); background:var(--paper-2)}
  .roster-actions button{
    background:var(--paper); border:1px solid var(--line-strong); color:var(--ink-soft);
    border-radius:var(--radius); padding:6px 11px; font-family:"Barlow Condensed",sans-serif;
    font-weight:600; text-transform:uppercase; letter-spacing:.07em; font-size:11.5px;
  }
  .roster-actions button:hover{border-color:var(--olive); color:var(--ink)}
  .roster-actions button.primary{background:var(--olive); color:#F1EDDF; border-color:var(--olive)}

  .empty-note{padding:24px 15px; text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.55}

  /* ---- Modal / export ---- */
  dialog{
    border:1px solid var(--line-strong); border-radius:var(--radius); padding:0;
    background:var(--paper); color:var(--ink); max-width:640px; width:92vw; box-shadow:var(--shadow);
  }
  dialog::backdrop{background:rgba(20,22,15,.55)}
  .dlg-h{background:var(--olive); color:#F1EDDF; padding:11px 16px; display:flex; justify-content:space-between; align-items:center}
  .dlg-h h3{text-transform:uppercase; letter-spacing:.04em; font-size:17px}
  .dlg-b{padding:16px}
  .dlg-b textarea{width:100%; min-height:280px; font-family:"IBM Plex Mono",monospace; font-size:12px;
    background:var(--paper-2); color:var(--ink); border:1px solid var(--line-strong); border-radius:var(--radius); padding:10px}
  .dlg-b .saved-list{display:flex; flex-direction:column; gap:6px; margin-top:4px}
  .saved-row{display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--line); border-radius:var(--radius); padding:7px 10px}
  .saved-row button{font-size:11px; padding:4px 9px; border-radius:2px; border:1px solid var(--line-strong); background:var(--paper-2); font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft)}

  /* ---- Compendium ---- */
  .comp section{margin:30px 0}
  .comp h2{
    font-size:24px; text-transform:uppercase; letter-spacing:.05em; color:var(--olive);
    border-bottom:2px solid var(--olive); padding-bottom:4px; margin-bottom:6px;
  }
  .comp .lead{color:var(--ink-soft); font-size:14.5px; max-width:74ch; margin:6px 0 14px; line-height:1.62}
  .tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius)}
  table.ref{border-collapse:collapse; width:100%; font-size:13.5px; min-width:560px}
  table.ref th, table.ref td{text-align:left; padding:8px 11px; border-bottom:1px solid var(--line)}
  table.ref thead th{
    background:var(--paper-2); font-family:"Barlow Condensed",sans-serif; text-transform:uppercase;
    letter-spacing:.08em; font-size:11.5px; color:var(--ink-soft); position:sticky; top:0;
  }
  table.ref tbody tr:hover{background:var(--paper-2)}
  table.ref .num{font-family:"IBM Plex Mono",monospace; text-align:right; white-space:nowrap}
  table.ref .src{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint)}

  .callout{
    background:var(--paper); border:1px solid var(--line); border-top:3px solid var(--olive);
    border-radius:var(--radius); padding:14px 16px; font-size:13.5px; color:var(--ink-soft); line-height:1.6;
  }
  .callout b{color:var(--ink)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  @media (max-width:680px){ .grid2{grid-template-columns:1fr} }

  footer.foot{max-width:1220px; margin:40px auto 0; padding:18px 20px; border-top:1px solid var(--line); color:var(--ink-soft); font-size:12.5px; line-height:1.6}

  /* ---- Review sheet ---- */
  .sheet{max-width:980px; margin:0 auto; background:var(--paper); border:1px solid var(--line-strong); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .sheet-actions{display:flex; gap:8px; justify-content:flex-end; padding:12px 18px; background:var(--paper-2); border-bottom:1px solid var(--line)}
  .sheet-actions button{
    background:var(--paper); border:1px solid var(--line-strong); color:var(--ink-soft);
    border-radius:var(--radius); padding:6px 13px; font-family:"Barlow Condensed",sans-serif;
    font-weight:600; text-transform:uppercase; letter-spacing:.07em; font-size:12px;
  }
  .sheet-actions button#pdfBtn{background:var(--olive); color:#F1EDDF; border-color:var(--olive)}
  .sheet-head{background:var(--olive); color:#F1EDDF; padding:18px 24px}
  .sheet-head h2{font-size:clamp(22px,3.5vw,30px); text-transform:uppercase; letter-spacing:.03em}
  .sheet-meta{display:flex; flex-wrap:wrap; gap:4px 20px; margin-top:7px; font-size:12px;
    color:rgba(241,237,223,.88); font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.07em; font-weight:600}
  .sheet-body{padding:18px 24px 30px}
  .sheet-brief{border-left:3px solid var(--oxide); padding-left:13px; margin-bottom:14px; font-size:13px; color:var(--ink-soft); line-height:1.7}
  .sheet-brief b{color:var(--ink)}
  .sheet-check{display:flex; flex-wrap:wrap; gap:6px 16px; margin:10px 0}
  .sheet-check .check{font-size:12.5px}
  .comp-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin:14px 0 6px}
  .comp-tile{border:1px solid var(--line); border-radius:var(--radius); padding:9px 8px; text-align:center; background:var(--paper-2)}
  .comp-tile .n{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:500; line-height:1}
  .comp-tile .l{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-family:"Barlow Condensed",sans-serif; font-weight:600; margin-top:4px}
  .sheet h3{font-size:15.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--olive);
    border-bottom:1px solid var(--line-strong); padding-bottom:3px; margin:20px 0 4px}
  .sheet-row{display:grid; grid-template-columns:1fr auto; gap:3px 16px; padding:10px 0; border-bottom:1px dotted var(--line)}
  .sheet-row .nm{font-weight:600; font-size:14.5px}
  .sheet-row .ct{grid-row:1; grid-column:2; font-family:"IBM Plex Mono",monospace; font-size:14px; align-self:start; white-space:nowrap; font-weight:500}
  .sheet-break{grid-column:1 / -1; display:flex; flex-direction:column; gap:3px; margin-top:3px}
  .sheet-break > div{display:flex; justify-content:space-between; gap:14px; align-items:baseline;
    font-size:12.5px; color:var(--ink-soft); padding-left:13px; border-left:2px solid var(--line-strong)}
  .sheet-break > div > span:first-child{line-height:1.5}
  .sheet-break > div > span:last-child{font-family:"IBM Plex Mono",monospace; flex:none; color:var(--ink-soft)}
  .sheet-total{display:flex; justify-content:space-between; align-items:baseline; margin-top:18px; padding-top:11px;
    border-top:2px solid var(--olive); font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.07em; font-weight:700}
  .sheet-total .big{font-family:"IBM Plex Mono",monospace; font-size:21px; font-weight:500}
  .sheet-hint{font-size:12.5px; color:var(--ink-soft); margin-top:14px; line-height:1.55}

  :focus-visible{outline:2px solid var(--brass); outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }

  /* ---- Print (Review sheet only → "Save as PDF") ---- */
  @media print{
    /* Force a pure black-on-white palette regardless of the on-screen theme,
       so the PDF is crisp even with "Background graphics" turned off.
       !important on the custom properties beats the dark-mode :root rules. */
    :root{
      --ground:#fff !important; --paper:#fff !important; --paper-2:#fff !important; --sink:#e6e6e6 !important;
      --ink:#000 !important; --ink-soft:#161616 !important; --ink-faint:#2e2e2e !important;
      --line:#8a8a8a !important; --line-strong:#4a4a4a !important;
      --olive:#232a17 !important; --olive-bright:#232a17 !important;
      --brass:#5c4708 !important; --oxide:#7a2814 !important;
      --ok:#22421a !important; --warn:#5c4708 !important; --fail:#7a2814 !important;
      --shadow:none !important;
    }
    html, body{background:#fff !important; color:#000 !important;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    header.masthead, footer.foot, .theme-toggle, .modes,
    #view-build, #view-comp, .sheet-actions, .sheet-hint{display:none !important}
    #view-review{display:block !important}
    .wrap{padding:0; max-width:none}

    .sheet{box-shadow:none; border:0; max-width:none; border-radius:0; overflow:visible}
    /* the olive header prints as bold black-on-white, no colour fill needed */
    .sheet-head{background:#fff !important; color:#000 !important; padding:0 0 10px;
      border-bottom:2.5px solid #000; margin-bottom:12px}
    .sheet-head h2{color:#000 !important}
    .sheet-meta{color:#1a1a1a !important; font-weight:600}
    .sheet-body{padding:0}
    .sheet-brief, .sheet-brief b{color:#000 !important}
    .sheet-brief{border-left:3px solid #000}
    .sheet-check .check, .sheet-check .check span{color:#000 !important}
    .sheet-check .dot{-webkit-print-color-adjust:exact; print-color-adjust:exact}
    .comp-tile{border:1px solid #999}
    .comp-tile .n, .comp-tile .l{color:#000 !important}
    .sheet h3{color:#000 !important; border-bottom:1.5px solid #000; break-after:avoid}
    .sheet-row{break-inside:avoid}
    .sheet-row .nm, .sheet-row .ct{color:#000 !important; font-weight:700}
    .sheet-break > div{color:#1a1a1a !important; border-left:2px solid #000}
    .sheet-break > div > span:first-child{color:#000 !important}
    .sheet-break > div > span:last-child{color:#000 !important}
    .sheet-total, .sheet-total .big{color:#000 !important; border-top:2px solid #000}
    a{color:#000 !important; text-decoration:none}
  }
</style>

<script>
"use strict";

/* Version = 1.<number of revisions since the first release>.
   Bump the last entry's number and add a CHANGELOG line on every revision. */
const APP_VERSION = '1.13';
const CHANGELOG = [
  ['1.0', 'First release — builder, order-of-battle checks, compendium.'],
  ['1.1', 'Scenario-driven: 9 board-wargame scenarios set effective points, fortification, reserves and the checklist.'],
  ['1.2', 'Verified every unit against the rulebooks; split the roster into In-the-game / House-rule / Fan tiers.'],
  ['1.3', 'Whole app translated to English; Support strategy cards replaced by a Specializations panel.'],
  ['1.4', 'Review sheet + "Save as PDF" print view.'],
  ['1.5', 'Itemised purchase lines (figures, tokens, transport priced individually) and an Auto-fill generator.'],
  ['1.6', 'Renamed to Tide of Iron · Battle Builder.'],
  ['1.7', 'Version number and changelog added.'],
  ['1.8', 'Separate anti-personnel and anti-vehicle profiles (range + firepower) on every unit, shown as "Inf R/F · Veh R/F", with a stat-line legend.'],
  ['1.9', 'Collections row — tick which sets you own (All expansions, Days of the Fox, Normandy, Fury of the Bear, Stalingrad, Tools of War, house-rule, fan) to control which units you can field.'],
  ['1.10', 'Confirmed against the rulebook: a squad with a heavy infantry weapon may never take a specialization token — enforced and cited in the compendium.'],
  ['1.11', 'Readability pass — IBM Plex Sans body text, larger type, a brighter paper and much darker ink so the content stops blending into the background, especially on mobile.'],
  ['1.12', 'PDF / print fix — the Review sheet now prints pure black‑on‑white regardless of the on‑screen theme, so the exported PDF is crisp even with "Background graphics" off.'],
  ['1.13', 'Compendium — added the anti-tank gun / Equipment rules: manning and firing, moving one space with the crew, the optional vehicle limber / tow rule, capture, and squad transport.'],
];

/* =====================================================================
   DATA — units, stats and points.
   Sources: Tide of Iron core game + Days of the Fox + Designer Series Vol.1
   + Normandy + Fury of the Bear + Stalingrad + Next Wave / Tools of War (1A),
   unit values cross-checked against commandsandcolors.net/tideofiron.
   Stat shorthand (matches the ToI unit cards, which list two target profiles):
     Inf R/F  = range / firepower when firing at infantry (squads)
     Veh R/F  = range / firepower when firing at vehicles
     Mv       = movement · Armor = vehicle armor value (AV)
   Firepower = black attack dice (hit on 4–6; 6 only at long range, 3–6 close).
   ===================================================================== */

const FIG = {
  regular: { key:'regular', label:'Regular', short:'R', cost:5,  stat:'Inf 4/1 · Veh 1/1 · Mv 4' },
  elite:   { key:'elite',   label:'Elite',   short:'E', cost:9,  stat:'Inf 4/2 · Veh 1/1 · Mv 4 · Battle-Hardened' },
  officer: { key:'officer', label:'Officer', short:'O', cost:13, stat:'Inf 4/1 · Veh 1/1 · Mv 4 · Rally, +move, +cover' },
};
const STAT_LEGEND = 'Stat line — <b>Inf R/F</b> = range / firepower vs infantry · <b>Veh R/F</b> = range / firepower vs vehicles · <b>Mv</b> = movement · <b>Armor</b> = vehicle armor. Firepower = attack dice; range in spaces.';

/* Specialization tokens — the small pieces you attach to an infantry squad
   during setup. One per squad, never on a weapon team. */
const SPECS = [
  { key:'antitank',    name:'Anti-Tank',    src:'Base',           pt:12, rule:'Against vehicles the squad fires at range 3 (instead of the normal 1) with +3 firepower — even when supporting another unit’s attack.' },
  { key:'flamethrower',name:'Flamethrower', src:'Base',           pt:14, rule:'Attack an adjacent space (range 1) only: +2 firepower and the target gets −5 cover (min 0). Armor still applies, but the flames bite.' },
  { key:'engineer',    name:'Engineer',     src:'Base',           pt:8,  rule:'Dig an entrenchment (fatigues the squad). Clear razor wire for 2 MP. Lay smoke. Not slowed by wire.' },
  { key:'medic',       name:'Medic',        src:'Base',           pt:8,  rule:'Bandage: this squad and squads in its space get +1 cover vs normal attacks. Heal: fatigue to roll 4–6 and return a regular infantry figure.' },
  { key:'recon',       name:'Recon',        src:'Days of the Fox',pt:7,  rule:'Stamina: +1 movement (on top of the leader bonus). Stealth: cannot be attacked at long range.' },
  { key:'alpha',       name:'Alpha Unit (experience)', src:'Days of the Fox', pt:9, rule:'Elite squad, starts with 1 star; upgrades after a solo fire action scoring 2+ hits. +1 firepower vs infantry per star (Bronze / Silver Star / Medal of Honor tokens).' },
  { key:'bravo',       name:'Bravo Unit (experience)', src:'Days of the Fox', pt:9, rule:'Elite squad, starts with 1 star; upgrades after surviving an attack of 2+ hits. +1 cover per star.' },
  { key:'demolition',  name:'Demolitions',  src:'Normandy',       pt:10, rule:'Place a charge (2 MP during an Advance). Detonate as an action or via Op Fire: each charge deals 3 automatic hits to every unit in the space / pillbox (roll armor & cover).' },
  { key:'expert',      name:'Expert',       src:'Fury of the Bear',pt:13, rule:'Adaptability: for each figure in the squad, re-roll one attack die of your choice when the squad attacks (no die re-rolled twice).' },
  { key:'saboteur',    name:'Saboteur',     src:'Fury of the Bear',pt:7,  rule:'Takes all neutral + own-nation Sabotage cards. Play them to disrupt the enemy Strategy decks near enemy command objectives.' },
];
const SPEC_BY_KEY = Object.fromEntries(SPECS.map(s=>[s.key,s]));

/* Doctrines are an OPTIONAL house rule — Tide of Iron has no official
   national rules. Ignore them for a pure card-driven game. */
const DOCTRINES = {
  usa:     { name:'Combined Arms',     text:'All transports cost 20% less. Deep pool of armor and specializations.' },
  germany: { name:'Kampfkraft',        text:'One rifle squad may deploy with elite figures for −3 pts. Heavy-tank cap rises to 1 per 500 pts.' },
  britain: { name:'Steady Under Fire', text:'Each round, the first of your squads that would be pinned is not pinned.' },
  soviet:  { name:'Not One Step Back', text:'Regular figures cost 4 pts. Mass Assault: up to two regular squads may activate together. Elite (Guards) max 1 per 500 pts.' },
  japan:   { name:'Banzai',            text:'Assault attacks +2 firepower; squads ignore the first pin while adjacent to the enemy. Light and medium tanks only.' },

/* =====================================================================
   SCENARIOS — classic board-wargame setups (Bolt Action / Flames of War /
   generic). Each scenario sets the effective points, whether fortification
   is allowed, reserves, deployment and victory condition — and drives the
   order-of-battle checklist in the right panel.
   asym: true = attacker/defender each with their own points multiplier.

   ===================================================================== */
const SCENARIOS = [

  { key:'attack', name:'Attack & Defend', src:'Hasty Attack', asym:true,
    attacker:{ mult:1.00, fort:0, reserves:0.25,
      deploy:'Deploy in the attack zone. A quarter of the force in reserve as a second wave.',
      orders:'Weight your points toward mobile units and smoke to break the defense.' },
    defender:{ mult:0.75, fort:0.25, freeEntrench:2, reserves:0,

  { key:'breakthrough', name:'Breakthrough', src:'Break Out', asym:true,
    attacker:{ mult:1.15, fort:0, reserves:0,
      deploy:'Deploy along your board edge. No reserves.',
      orders:'At least 3 mobile units (Mv 6+, transport or recon) — you must move units OFF the far edge.' },
    defender:{ mult:0.90, fort:0.20, freeEntrench:2, reserves:0.25,
      deploy:'Spread thin to cover the whole board width. Two free entrenchments. A quarter in mobile reserve.',
      orders:'You cannot be strong everywhere — cover flat and keep a mobile fire-brigade reserve.' },
    vc:'The attacker scores for every unit that leaves the defender rear edge.',
    orders:'' },

  { key:'beachhead', name:'Beachhead', src:'No Retreat', asym:true,
    attacker:{ mult:1.50, fort:0, reserves:0.33,

    defender:{ mult:0.70, fort:0.35, freeEntrench:3, bunker:true, reserves:0.25,

      orders:'Pin the attacker on the beach. Commit the counter-attack reserve (tanks) when the beachhead wavers.' },
    vc:'The attacker must clear the defense zone; the defender wins by holding to the time limit.',
    orders:'' },
];
function scenByKey(k){ return SCENARIOS.find(s=>s.key===k) || SCENARIOS[0]; }

/* Transport lists per nation. tier: core = in the physical box · ext =
   house rule / supplement (not in the box) · fan = fan expansion. */

/* Squad templates. kind: command | rifle | elite | mg | mortar.
   ToI uses generic regular / elite / officer figures — not named formations. */
function stdSquads(nat, src, names){
  return [
    { id:nat+'_cmd',  cat:'command', kind:'command', name:'Command Squad', src,
      stat:'Command squad · 1 Officer + up to 3 figures', desc:'Rally, Fast Recovery, +1 movement and +1 cover vs suppressive fire for the squad.' },
    { id:nat+'_rifle',cat:'infantry',kind:'rifle',   name:'Rifle Squad', src,

      stat:'4 figure slots · '+FIG.elite.stat, desc:'Battle-Hardened: each figure gives +1 cover vs suppressive fire.' },

      stat:'Inf 8/4 · Veh 8/2 · Mv 4 · 2-crew · area / indirect', desc:'Area attack (suppressive FP 4, normal FP 2), indirect fire (no LOS needed), minimum range 1, no Op Fire.' },
  ];
}

const NATIONS = {

    vehicles: [

      { id:'us_m10',     name:'M10 Wolverine',       src:'Normandy',   tier:'core', pt:85,  stat:'Inf 5/6 · Veh 7/10 · Mv 6 · Armor 4 · Penetration, open top', class:'td' },
      { id:'us_stuart',  name:'M5A1 Stuart',         src:'House rule', tier:'ext',  pt:45,  stat:'Inf 5/5 · Veh 4/5 · Mv 7 · Armor 3', class:'light' },

  { key:'normandy',   label:'Normandy',        srcs:['Normandy'] },

  { key:'fan',        label:'Fan · Tail of the Dragon', srcs:['fan: Tail of the Dragon'], cls:'fan' },
];
const OFFICIAL_COLLS = ['base','dof','normandy','fotb','stalingrad','toolsofwar'];
const DEFAULT_COLLS  = ['base','dof','normandy','fotb','stalingrad'];

function collectionsFor(src){
  if(!src) return ['base'];
  const parts = src.split(' / ').map(s=>s.trim());
  const keys = [];
  for(const p of parts){
    const c = COLLECTIONS.find(c => c.srcs.some(s => p===s) || (p.startsWith('fan') && c.key==='fan'));
    if(c) keys.push(c.key);
  }
  return keys.length ? keys : ['base'];
}
function srcEnabled(src){ return collectionsFor(src).some(k => state.collections.includes(k)); }

/* =====================================================================
   STATE
   ===================================================================== */
const LS_KEY = 'toi-order-of-battle-lists-v1';
let state = { nation:'usa', limit:700, name:'New force', items:[], cat:'infantry', scenario:'pitched', role:'attacker', collections:DEFAULT_COLLS.slice() };
const isFanNation = ()=> !!NATIONS[state.nation].fan;
/* a nation can only be fielded if the set holding its basic troops is on */
function ensureNationColls(){
  for(const k of collectionsFor(NATIONS[state.nation].squads[0].src))
    if(!state.collections.includes(k)) state.collections.push(k);
}
let uidc = 1;
const uid = ()=> 'u'+(uidc++);

/* resolve the scenario + role into one context */
function sctx(){
  const s = scenByKey(state.scenario);
  let o = { key:s.key, name:s.name, src:s.src, deploy:s.deploy, vc:s.vc, orders:s.orders||'',
            mult:1, fort:s.fort||0, freeEntrench:s.freeEntrench||0, reserves:s.reserves||0,
            bunker:!!s.bunker, asym:!!s.asym, roleLabel:'' };
  if(s.asym){
    const r = state.role==='defender' ? s.defender : s.attacker;
    o.mult = r.mult; o.fort = r.fort||0; o.freeEntrench = r.freeEntrench||0;
    o.reserves = r.reserves||0; o.bunker = !!r.bunker;
    o.orders = r.orders || s.orders || '';
    o.deploy = r.deploy || s.deploy;
    o.roleLabel = state.role==='defender' ? 'defender' : 'attacker';
  }
  return o;
}
function effLimit(){ return Math.max(100, Math.round(state.limit * sctx().mult / 25) * 25); }
function fortBudget(){ return Math.round(effLimit() * sctx().fort); }

function defaultSlots(kind){
  if(kind==='command') return ['officer','regular','regular','regular'];
  if(kind==='elite')   return ['elite','elite','elite','elite'];
  return ['regular','regular','regular','regular'];
}

function seedSample(){
  // USA @ 700, Attack &amp; Defend — a realistic starting point
  state = { nation:'usa', limit:700, name:'Task Force — Normandy', items:[], cat:'infantry', scenario:'attack', role:'attacker', collections:DEFAULT_COLLS.slice() };
  add('usa_cmd');
  add('usa_rifle');
  add('usa_rifle'); const r = state.items[state.items.length-1]; r.spec='antitank';
  add('usa_rifle');

  add('usa_mortar');

  const ht = state.items.find(i=>i.defId==='usa_rifle'); if(ht) ht.transportId='us_ht';
}

/* =====================================================================
   LOOKUP
   ===================================================================== */
function findDef(id){
  const N = NATIONS[state.nation];
  for(const s of N.squads) if(s.id===id) return {...s, _type:'squad'};
  for(const v of N.vehicles) if(v.id===id) return {...v, cat:'vehicle', _type:'vehicle'};
  for(const g of N.guns) if(g.id===id) return {...g, cat:'gun', _type:'gun'};
  for(const t of TRANSPORTS[state.nation]) if(t.id===id) return {...t, cat:'transport', _type:'transport'};
  for(const f of FORTS) if(f.id===id) return {...f, cat:'fort', _type:'fort'};
  return null;
}

function itemCost(it){
  const d = findDef(it.defId);
  if(!d) return 0;
  if(d._type==='squad'){
    let c = 0;
    const heavyWeapon = d.kind==='mg' || d.kind==='mortar';
    if(d.kind==='mg') c = 17;
    else if(d.kind==='mortar') c = 21;
    else {
      for(const s of it.slots){ if(s && FIG[s]) c += FIG[s].cost; }
      if(state.nation==='soviet'){ // doctrine: regular figures −1
        const reg = it.slots.filter(s=>s==='regular').length; c -= reg;
      }
    }
    // Official rule: a squad with a heavy infantry weapon may never take a specialization token.
    if(heavyWeapon) it.spec = null;
    if(it.spec && SPEC_BY_KEY[it.spec]) c += SPEC_BY_KEY[it.spec].pt;
    if(it.transportId){
      const t = TRANSPORTS[state.nation].find(x=>x.id===it.transportId);
      if(t){ let tc = t.pt; if(state.nation==='usa') tc = Math.round(tc*0.8); c += tc; }
    }
    return c;
  }
  return Math.max(0, d.pt * (it.qty||1));
}
function totalCost(){ return state.items.reduce((a,it)=>a+itemCost(it),0); }

/* =====================================================================
   MUTATION
   ===================================================================== */
function add(defId){
  const d = findDef(defId); if(!d) return;
  const it = { uid:uid(), defId, qty:1, slots:null, spec:null, transportId:null };
  if(d._type==='squad') it.slots = defaultSlots(d.kind);
  state.items.push(it);
  render();
}
function removeItem(u){ state.items = state.items.filter(i=>i.uid!==u); render(); }
function cycleSlot(u, idx){
  const it = state.items.find(i=>i.uid===u); if(!it) return;
  const d = findDef(it.defId);
  const order = d.kind==='command' && idx===0 ? ['officer'] :
                d.kind==='command' ? ['regular','elite','empty'] :
                ['regular','elite','officer','empty'];
  let cur = it.slots[idx]||'empty';
  let ni = (order.indexOf(cur)+1) % order.length;
  let next = order[ni];
  if(next==='officer' && it.slots.filter((s,i)=>i!==idx && s==='officer').length>0){
    next = order[(ni+1)%order.length];
  }
  if(next==='empty' && it.slots.filter((s,i)=>i!==idx && s && s!=='empty').length===0){
    next = 'regular'; // keep at least one figure
  }
  it.slots[idx] = next==='empty' ? 'empty' : next;
  render();
}
function setSpec(u, val){ const it=state.items.find(i=>i.uid===u); if(it){ it.spec = val||null; render(); } }
function setTransport(u, val){ const it=state.items.find(i=>i.uid===u); if(it){ it.transportId = val||null; render(); } }
function setQty(u, delta){
  const it = state.items.find(i=>i.uid===u); if(!it) return;
  it.qty = Math.max(1, (it.qty||1)+delta);
  render();
}
function eligibleForSpec(){
  return state.items.filter(it=>{
    const d = findDef(it.defId);
    return d && d._type==='squad' && (d.kind==='rifle'||d.kind==='elite') && !it.spec;
  });
}
function assignSpecToNext(key){
  const e = eligibleForSpec();
  if(!e.length) return;
  e[0].spec = key;
  render();
}

/* =====================================================================
   VALIDATION — order of battle
   ===================================================================== */
function validate(){
  const out = [];
  const C = sctx();
  const lim = effLimit();
  const used = totalCost();
  const squads = state.items.filter(i=>findDef(i.defId)?._type==='squad');
  const cmd = squads.filter(i=>findDef(i.defId).kind==='command');
  const otherInf = squads.filter(i=>['rifle','elite','mg','mortar'].includes(findDef(i.defId).kind));
  const vehicles = state.items.filter(i=>findDef(i.defId)?._type==='vehicle');
  const vehCount = vehicles.reduce((a,i)=>a+(i.qty||1),0);
  const guns = state.items.reduce((a,i)=> a + (findDef(i.defId)?._type==='gun' ? (i.qty||1):0), 0);
  const forts = state.items.filter(i=>findDef(i.defId)?._type==='fort');
  const heavyCap = state.nation==='germany' ? Math.max(1, Math.floor(lim/500)) : Math.max(1, Math.floor(lim/750));
  const heavies = vehicles.filter(i=>findDef(i.defId).class==='heavy').reduce((a,i)=>a+(i.qty||1),0);
  const vehSlots = Math.max(1, Math.round(lim/250));
  const specialized = squads.filter(i=>i.spec).length;
  const specCap = Math.ceil(squads.length/2);
  const fortPts = forts.reduce((a,i)=>a+itemCost(i),0);
  const mobile = vehicles.filter(i=>{ const d=findDef(i.defId); return d.class==='light'; }).reduce((a,i)=>a+(i.qty||1),0)
    + squads.filter(i=>i.transportId).length
    + squads.filter(i=>i.spec==='recon').length;

  out.push(used>lim
    ? {s:'fail', t:`Over the limit by ${used-lim} pts${C.roleLabel?` (${C.roleLabel}: ${lim} pts)`:''}.`}
    : {s:'ok', t:`${lim-used} pts left of ${lim}${C.roleLabel?` (${C.roleLabel})`:''}.`});

  out.push(cmd.length>=1 ? {s:'ok', t:'Command squad present.'} : {s:'fail', t:'No command squad.'});
  out.push(otherInf.length>=2 ? {s:'ok', t:`${otherInf.length} infantry / weapon squads.`} : {s:'fail', t:'Needs at least 2 infantry / weapon squads beyond command.'});

  if(heavies>heavyCap) out.push({s:'fail', t:`Too many heavy tanks (${heavies}/${heavyCap} at ${lim} pts).`});
  else if(heavies>0) out.push({s:'ok', t:`Heavy tanks: ${heavies}/${heavyCap}.`});
  if(state.nation==='japan' && vehicles.some(i=>findDef(i.defId).class==='heavy')) out.push({s:'fail', t:'Japanese doctrine: no heavy tanks.'});

  const biggest = Math.max(0, ...state.items.map(i=> findDef(i.defId)?._type==='squad' ? itemCost(i) : itemCost(i)/(i.qty||1) ));
  if(biggest > lim/3) out.push({s:'warn', t:`A single unit costs more than ⅓ of the limit (${Math.round(biggest)} pts).`});

  if(vehCount > vehSlots) out.push({s:'warn', t:`Many vehicles (${vehCount}/${vehSlots} recommended).`});
  if(guns > vehSlots) out.push({s:'warn', t:`Many guns / emplacements (${guns}/${vehSlots} recommended).`});
  if(specialized > specCap) out.push({s:'warn', t:`More specialized squads than recommended (${specialized}/${specCap}).`});

  if(forts.length){
    if(C.fort<=0) out.push({s:'fail', t:`"${C.name}"${C.roleLabel?` (${C.roleLabel})`:''} does not allow fortification — remove ${forts.length} item(s).`});
    else if(fortPts > fortBudget()) out.push({s:'fail', t:`Fortification ${fortPts} pts exceeds the cap of ${fortBudget()} pts (${Math.round(C.fort*100)}%).`});
    else out.push({s:'ok', t:`Fortification ${fortPts}/${fortBudget()} pts.`});
  } else if(C.freeEntrench>0){
    out.push({s:'warn', t:`You are the defender with ${C.freeEntrench} free entrenchment(s) — consider digging in (Fortifications tab).`});
  }

  if(C.reserves>0) out.push({s:'ok', t:`Reserves: ~${Math.round(C.reserves*100)}% of the force (${Math.round(lim*C.reserves)} pts) starts off the board.`});
  if(C.key==='breakthrough' && state.role==='attacker' && mobile<3)
    out.push({s:'warn', t:`Breakthrough: only ${mobile} mobile units — aim for at least 3 (light tanks, transports, recon).`});
  if(C.key==='flank' && mobile<2)
    out.push({s:'warn', t:'Flank attack: bring at least 2 mobile units for the flanking element.'});
  if(C.key==='demolition' && !squads.some(i=>i.spec==='demolition'))
    out.push({s:'warn', t:'Demolition: bring a Demolitions squad to destroy the enemy objective.'});
  if((C.key==='hold'||C.key==='attack'||C.key==='beachhead') && state.role==='defender' && guns===0 && !squads.some(i=>i.spec==='antitank'))
    out.push({s:'warn', t:'Defense: you have no anti-tank (gun or Anti-Tank specialization).'});
  if(C.key==='attrition' && biggest > lim/4)
    out.push({s:'warn', t:'Attrition: expensive single units are a liability — kill points decide the game.'});

  const offSet = state.items.filter(i=>{ const d=findDef(i.defId); return d && d.src && !srcEnabled(d.src); });
  if(offSet.length)
    out.push({s:'warn', t:`${offSet.length} unit(s) come from a set that is currently switched off (see Collections).`});
  const houseFan = state.items.filter(i=>{ const d=findDef(i.defId); return d && d.tier && d.tier!=='core' && srcEnabled(d.src); });
  if(houseFan.length)
    out.push({s:'warn', t:`${houseFan.length} unit(s) are house-rule / fan, not from the physical box.`});

  return out;
}

/* =====================================================================

const $ = s => document.querySelector(s);

function render(){
  renderNationSel();
  renderScenarioSel();
  renderCollections();
  renderDoctrine();
  renderBriefing();
  renderTabs();
  renderUnitList();
  renderRoster();
}

function renderScenarioSel(){
  const sel = $('#scenarioSel');
  if(!sel.options.length){
    for(const s of SCENARIOS){
      const o = document.createElement('option');
      o.value = s.key; o.innerHTML = `${s.name} — ${s.src}`;
      sel.appendChild(o);
    }
  }
  sel.value = state.scenario;
  const asym = scenByKey(state.scenario).asym;
  $('#roleWrap').hidden = !asym;
  $('#roleSel').value = state.role;
}

function toggleCollection(key){
  if(key === 'all'){
    const allOn = OFFICIAL_COLLS.every(k => state.collections.includes(k));
    state.collections = allOn ? DEFAULT_COLLS.slice()
      : Array.from(new Set([...state.collections, ...OFFICIAL_COLLS]));
  } else {
    const c = COLLECTIONS.find(x=>x.key===key);
    if(c && c.locked) return;
    const i = state.collections.indexOf(key);
    if(i >= 0) state.collections.splice(i,1); else state.collections.push(key);
  }
  ensureNationColls();
  if(state.cat==='fort' && sctx().fort<=0) state.cat = 'infantry';
  render();
}

function renderCollections(){
  const bar = $('#collBar');
  const allOn = OFFICIAL_COLLS.every(k => state.collections.includes(k));
  let h = `<span class="collbar-lbl">Sets</span>`;
  h += `<button class="coll-chip all" data-coll="all" aria-pressed="${allOn}">All expansions</button>`;
  for(const c of COLLECTIONS){
    const on = state.collections.includes(c.key);
    h += `<button class="coll-chip ${c.cls||''}" data-coll="${c.key}" aria-pressed="${on}" ${c.locked?'disabled title="Always available"':''}>${c.label}</button>`;
  }
  bar.innerHTML = h;
  bar.querySelectorAll('[data-coll]').forEach(b=> b.onclick = ()=> toggleCollection(b.dataset.coll));
}

function renderBriefing(){
  const C = sctx();
  const roleTag = C.roleLabel ? ` · <b style="color:var(--oxide)">${C.roleLabel.toUpperCase()}</b>` : '';
  const multTxt = C.mult!==1 ? ` (${C.mult>1?'+':''}${Math.round((C.mult-1)*100)}% points)` : '';
  $('#briefingBox').innerHTML =
    `<b>Scenario — ${C.name}${roleTag}</b>` +
    `<span class="orders">${C.orders || 'Build a balanced force within the limit.'}</span>` +
    `<span class="vc"><b>Deployment:</b> ${C.deploy}</span>` +
    `<span class="vc"><b>Victory:</b> ${C.vc}</span>` +
    `<span class="vc"><b>Effective limit:</b> ${state.limit}${multTxt} → ${effLimit()} pts` +
      (C.fort>0 ? ` · fortification up to ${fortBudget()} pts` : ' · no fortification') +
      (C.freeEntrench>0 ? ` · ${C.freeEntrench} free entrenchment(s)` : '') + `</span>`;
}

function renderNationSel(){
  const sel = $('#nationSel');
  if(!sel.options.length){
    for(const [k,v] of Object.entries(NATIONS)){
      const o = document.createElement('option'); o.value=k; o.textContent=v.label; sel.appendChild(o);
    }
  }
  sel.value = state.nation;
}
function renderDoctrine(){
  const d = NATIONS[state.nation].doctrine;
  $('#doctrineBox').innerHTML = `<b>Doctrine — ${d.name}</b><p>${d.text}</p>`;
}
function renderTabs(){
  const box = $('#catTabs');
  box.innerHTML = CATS.map(c=>
    `<button role="tab" data-cat="${c.key}" aria-selected="${state.cat===c.key}">${c.label}</button>`).join('');
  box.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ state.cat=b.dataset.cat; render(); });
  let note = CAT_NOTE[state.cat]||'';
  if(state.cat==='fort'){
    const C = sctx();
    note = C.fort>0

        + (C.freeEntrench>0 ? ` You also have ${C.freeEntrench} free entrenchment(s) that cost no points.` : '')
        + (C.bunker ? ' A bunker is allowed in this scenario.' : '')

  }

  leg.innerHTML = STAT_LEGEND;

function unitCatalog(){
  const N = NATIONS[state.nation];
  switch(state.cat){
    case 'command':  return N.squads.filter(s=>s.kind==='command' && srcEnabled(s.src));
    case 'infantry': return N.squads.filter(s=>(s.kind==='rifle'||s.kind==='elite') && srcEnabled(s.src));
    case 'weapons':  return N.squads.filter(s=>(s.kind==='mg'||s.kind==='mortar') && srcEnabled(s.src));
    case 'vehicle':  return N.vehicles.filter(v=>srcEnabled(v.src)).map(v=>({...v}));
    case 'gun':      return N.guns.filter(g=>srcEnabled(g.src)).map(g=>({...g}));
    case 'transport':return TRANSPORTS[state.nation].filter(t=>srcEnabled(t.src)).map(t=>({...t, desc:`Capacity ${t.cap}. Assign to an infantry squad in the right panel.`}));
    case 'fort':     return FORTS.filter(f=> f.id!=='f_bunker' || sctx().bunker).map(f=>({...f}));
  }
  return [];
}

function renderUnitList(){
  if(state.cat==='spec'){ renderSpecPanel(); return; }
  if(state.cat==='fort' && sctx().fort<=0){
    $('#unitList').innerHTML = `<p class="empty-note">Fortification is not allowed in "${sctx().name}"${sctx().roleLabel?` as the ${sctx().roleLabel}`:''}.<br>Pick e.g. <i>Attack &amp; Defend</i>, <i>Hold Until Relieved</i> or <i>Beachhead</i> as the defender.</p>`;
    return;
  }
  const list = unitCatalog();
  $('#unitList').innerHTML = list.map(u=>{
    const base = u.pt!=null ? u.pt : (u.kind==='command' ? 28 : u.kind==='elite' ? 36 : u.kind==='mg' ? 17 : u.kind==='mortar' ? 21 : 20);
    const fromLabel = ['command','rifle','elite'].includes(u.kind) ? 'from' : '';
    const tcl = u.tier==='ext' ? ' tag-ext' : u.tier==='fan' ? ' tag-fan' : '';
    return `<div class="unit">
      <h4>${u.name}<span class="tag${tcl}">${u.src}</span></h4>
      <div class="stat mono">${u.stat}</div>
      ${u.desc ? `<div class="desc">${u.desc}</div>`:''}
      <div class="price">
        <div class="pts">${fromLabel?`<small>${fromLabel} </small>`:''}${base}<small> pts</small></div>
        <button class="add-btn" data-add="${u.id}">Add</button>
      </div>
    </div>`;
  }).join('') || `<p class="empty-note">No units in this category for ${NATIONS[state.nation].label}.</p>`;
  $('#unitList').querySelectorAll('[data-add]').forEach(b=> b.onclick = ()=> add(b.dataset.add));
}

function renderSpecPanel(){
  const carriers = {};
  state.items.forEach(it=>{ if(it.spec && findDef(it.defId)){ (carriers[it.spec] ||= []).push(it); } });
  const nEligible = eligibleForSpec().length;
  const intro = `<p class="cat-note" style="margin-top:0">Currently ${nEligible} infantry squad(s) without a specialization. Assign one below, or use the dropdown on each squad in the force panel. Weapon teams cannot take a specialization.</p>`;
  const cards = SPECS.map(sp=>{
    const cs = carriers[sp.key] || [];
    const chips = cs.map(it=>{
      const d = findDef(it.defId);
      return `<button class="spec-chip" data-unassign="${it.uid}" title="Remove from this squad">${d.name} ✕</button>`;
    }).join('');
    return `<div class="spec-card${cs.length?' has':''}">
      <h4>${sp.name} <span class="src">${sp.src}</span> <span class="pt">+${sp.pt} pts</span></h4>
      <p>${sp.rule}</p>
      <div class="spec-foot">
        ${cs.length ? `<span class="mini-note" style="margin:0">On:</span> ${chips}` : `<span class="mini-note" style="margin:0">Not assigned.</span>`}
        <button class="add-btn" data-assignspec="${sp.key}" ${nEligible?'':'disabled'}>${nEligible?'Assign →':'No free squad'}</button>
      </div>
    </div>`;
  }).join('');
  $('#unitList').innerHTML = intro + cards + `
    <div class="callout" style="margin-top:14px">
      <b>Experience tokens (Days of the Fox):</b> Bronze Star, Silver Star and Medal of Honor — the 1–3 star markers that Alpha / Bravo squads upgrade with during play.<br>
      <b>Munitions tokens (Fury of the Bear, optional):</b> go on <i>vehicles</i>, not infantry — HE, AP-B, AP-C, Smoke.
    </div>`;
  $('#unitList').querySelectorAll('[data-assignspec]').forEach(b=> b.onclick = ()=> assignSpecToNext(b.dataset.assignspec));
  $('#unitList').querySelectorAll('[data-unassign]').forEach(b=> b.onclick = ()=> setSpec(b.dataset.unassign, ''));
}

function slotClass(s){ return s==='elite'?'el':s==='officer'?'of':s==='empty'?'em':'rg'; }
function slotChar(s){ return s==='elite'?'E':s==='officer'?'O':s==='empty'?'·':'R'; }

function renderRoster(){
  const C = sctx();
  const lim = effLimit();
  $('#ptsLimit').textContent = lim;
  const used = totalCost();
  $('#ptsUsed').textContent = used;
  const pct = Math.min(100, Math.round(used/lim*100));
  const bar = $('#ptsBar');
  bar.style.width = pct+'%';
  bar.classList.toggle('over', used>lim);
  $('#gaugeSub').textContent =
    `${C.name}${C.roleLabel?` · ${C.roleLabel}`:''}` +
    (lim!==state.limit ? `  ·  ${state.limit} base → ${lim}` : '');
  $('#listName').value = state.name;

  $('#checks').innerHTML = validate().map(c=>
    `<div class="check ${c.s}"><span class="dot ${c.s}"></span><span>${c.t}</span></div>`).join('');

  const groups = {
    command:'Command', infantry:'Infantry', weapons:'Weapon Teams',
    vehicle:'Vehicles', gun:'Guns &amp; Emplacements', transport:'Transport', fort:'Fortifications'
  };
  const byGroup = {};
  state.items.forEach(it=>{
    const d = findDef(it.defId); if(!d) return;
    const g = d.cat || d._type;
    (byGroup[g] ||= []).push(it);
  });

  let html = '';
  for(const [gk, gl] of Object.entries(groups)){
    if(!byGroup[gk] || !byGroup[gk].length) continue;
    html += `<div class="rgroup-h">${gl}</div>`;
    for(const it of byGroup[gk]) html += renderRosterItem(it);
  }
  const rl = $('#rosterList');
  rl.innerHTML = html || `<p class="empty-note">Empty list. Pick units from the arsenal on the left.</p>`;

  rl.querySelectorAll('[data-slot]').forEach(b=> b.onclick = ()=>{
    const [u,idx] = b.dataset.slot.split('|'); cycleSlot(u, +idx);
  });
  rl.querySelectorAll('[data-spec]').forEach(s=> s.onchange = ()=> setSpec(s.dataset.spec, s.value));
  rl.querySelectorAll('[data-trans]').forEach(s=> s.onchange = ()=> setTransport(s.dataset.trans, s.value));
  rl.querySelectorAll('[data-qty]').forEach(b=> b.onclick = ()=>{ const [u,d]=b.dataset.qty.split('|'); setQty(u,+d); });
  rl.querySelectorAll('[data-rm]').forEach(b=> b.onclick = ()=> removeItem(b.dataset.rm));
}

function renderRosterItem(it){
  const d = findDef(it.defId);
  const cost = itemCost(it);
  let cfg = '';
  if(d._type==='squad'){
    const heavy = d.kind==='mg'||d.kind==='mortar';
    if(!heavy){
      cfg += `<div class="ritem-cfg">` +
        it.slots.map((s,i)=>`<button class="slot ${slotClass(s)}" data-slot="${it.uid}|${i}" title="Click to change figure">${slotChar(s)}</button>`).join('') +
        `</div>`;
      const opts = ['<option value="">No specialization</option>']
        .concat(SPECS.map(sp=>`<option value="${sp.key}" ${it.spec===sp.key?'selected':''}>${sp.name} (+${sp.pt})</option>`));
      cfg += `<div class="ritem-cfg"><select data-spec="${it.uid}">${opts.join('')}</select></div>`;
    } else {
      cfg += `<div class="mini-note">2-crew heavy weapon team · no specialization</div>`;
    }
    const tOpts = ['<option value="">No transport</option>']
      .concat(TRANSPORTS[state.nation].filter(t=>srcEnabled(t.src)||it.transportId===t.id).map(t=>{
        let tc = state.nation==='usa'? Math.round(t.pt*0.8) : t.pt;
        return `<option value="${t.id}" ${it.transportId===t.id?'selected':''}>${t.name} (+${tc})</option>`;
      }));
    cfg += `<div class="ritem-cfg"><select data-trans="${it.uid}">${tOpts.join('')}</select></div>`;
  } else {
    cfg += `<div class="ritem-cfg">
      <div class="qty">
        <button data-qty="${it.uid}|-1" aria-label="Fewer">−</button>
        <span>${it.qty||1}</span>
        <button data-qty="${it.uid}|1" aria-label="More">+</button>
      </div>
      <span class="mini-note">${d.stat}</span>
    </div>`;
  }
  return `<div class="ritem">
    <div class="ritem-top">
      <span class="ritem-name">${d.name}${squadLabel(it,d)}</span>
      <span class="ritem-cost mono">${cost} pts</span>
    </div>
    ${cfg}
    <div class="ritem-cfg"><button class="x-btn" data-rm="${it.uid}">Remove</button></div>
  </div>`;
}
function squadLabel(it,d){
  if(d._type!=='squad') return '';
  if(d.kind==='mg'||d.kind==='mortar') return '';
  const c = {regular:0,elite:0,officer:0};
  it.slots.forEach(s=>{ if(c[s]!=null) c[s]++; });
  const parts = [];
  if(c.officer) parts.push(`${c.officer} Off`);
  if(c.elite) parts.push(`${c.elite} Elite`);
  if(c.regular) parts.push(`${c.regular} Reg`);
  const spec = it.spec ? ` +${SPEC_BY_KEY[it.spec].name}` : '';
  return (parts.length || spec) ? ` <span class="mini-note">(${parts.join(', ')}${spec})</span>` : '';
}

/* =====================================================================
   EXPORT / SAVE / LOAD
   ===================================================================== */
function armyText(){
  const N = NATIONS[state.nation];
  const C = sctx();
  const lim = effLimit();
  const used = totalCost();
  let L = [];
  L.push(`=== ${state.name.toUpperCase()} ===`);
  L.push(`Nation: ${N.label}  |  Doctrine: ${N.doctrine.name}`);
  L.push(`Scenario: ${C.name} (${C.src})${C.roleLabel?`  |  Role: ${C.roleLabel}`:''}`);
  L.push(`Points: ${state.limit} base${lim!==state.limit?` → ${lim} effective`:''}  |  Used: ${used}  |  Left: ${lim-used}`);
  if(C.reserves>0) L.push(`Reserves: ~${Math.round(C.reserves*100)}% starts off the board.`);
  if(C.fort>0) L.push(`Fortification allowed: up to ${fortBudget()} pts${C.freeEntrench?` + ${C.freeEntrench} free entrenchment(s)`:''}.`);
  L.push(`Deployment: ${C.deploy.replace(/<[^>]+>/g,'')}`);
  L.push(`Victory: ${C.vc}`);
  L.push('');
  const groups = { command:'COMMAND', infantry:'INFANTRY', weapons:'WEAPON TEAMS', vehicle:'VEHICLES', gun:'GUNS & EMPLACEMENTS', transport:'TRANSPORT', fort:'FORTIFICATIONS' };
  const byGroup = {};
  state.items.forEach(it=>{ const d=findDef(it.defId); if(!d) return; (byGroup[d.cat||d._type] ||= []).push(it); });
  for(const [gk,gl] of Object.entries(groups)){
    if(!byGroup[gk]) continue;
    L.push(gl);
    for(const it of byGroup[gk]){
      const d = findDef(it.defId);
      let name = d.name + squadLabel(it,d).replace(/<[^>]+>/g,'');
      if((it.qty||1)>1 && d._type!=='squad') name += `  x${it.qty}`;
      const dots = '.'.repeat(Math.max(3, 54 - name.length));
      L.push(`  ${name} ${dots} ${itemCost(it)}`);
      for(const b of purchaseLines(it,d)){
        const lbl = b.label.replace(/<[^>]+>/g,'').replace(/\s+/g,' ');
        L.push(`      - ${lbl.length>70?lbl.slice(0,69)+'…':lbl}  (${b.pts})`);
      }
    }
    L.push('');
  }
  L.push(`— Tide of Iron · Battle Builder v${APP_VERSION} — fan-made points system.`);
  return L.join('\n');
}

function openDlg(title, bodyHTML){
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = bodyHTML;
  $('#dlg').showModal();
}
function loadStore(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||{}; }catch(e){ return {}; } }
function saveStore(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }

function doSave(){
  const store = loadStore();
  store[state.name] = { nation:state.nation, limit:state.limit, name:state.name, items:state.items, scenario:state.scenario, role:state.role, collections:state.collections.slice() };
  saveStore(store);
  openDlg('Saved', `<p>Force <b>${esc(state.name)}</b> saved in this browser.</p>`);
}
function doLoad(){
  const store = loadStore();
  const keys = Object.keys(store);
  if(!keys.length){ openDlg('Load force', '<p>No saved forces in this browser yet.</p>'); return; }
  const rows = keys.map(k=>{
    const s = store[k];
    return `<div class="saved-row">
      <span><b>${esc(k)}</b> — ${NATIONS[s.nation]?.label||s.nation}, ${s.limit} pts</span>
      <span>
        <button data-loadkey="${encodeURIComponent(k)}">Open</button>
        <button data-delkey="${encodeURIComponent(k)}">Delete</button>
      </span></div>`;
  }).join('');
  openDlg('Load force', `<div class="saved-list">${rows}</div>`);
  $('#dlgBody').querySelectorAll('[data-loadkey]').forEach(b=> b.onclick = ()=>{
    const k = decodeURIComponent(b.dataset.loadkey); const s = loadStore()[k];
    state = { nation:s.nation, limit:s.limit, name:s.name, items:s.items, cat:'infantry',
              scenario:s.scenario||'pitched', role:s.role||'attacker',
              collections:(Array.isArray(s.collections)&&s.collections.length? s.collections.slice() : DEFAULT_COLLS.slice()) };
    ensureNationColls();
    uidc = 1 + state.items.reduce((m,i)=>Math.max(m, +(String(i.uid).replace('u',''))||0),0);
    $('#limitSel').value = [400,700,1000,1500].includes(s.limit)? String(s.limit):'custom';
    $('#customWrap').hidden = $('#limitSel').value!=='custom';
    if($('#limitSel').value==='custom') $('#customLimit').value = s.limit;
    $('#dlg').close(); render();
  });
  $('#dlgBody').querySelectorAll('[data-delkey]').forEach(b=> b.onclick = ()=>{
    const k = decodeURIComponent(b.dataset.delkey); const st = loadStore(); delete st[k]; saveStore(st); doLoad();
  });
}
function doNew(){
  state = { nation:state.nation, limit:state.limit, name:'New force', items:[], cat:'infantry',
            scenario:state.scenario, role:state.role, collections:state.collections.slice() };
  add(state.nation+'_cmd'); add(state.nation+'_rifle'); add(state.nation+'_rifle');
  render();
}

/* =====================================================================
   AUTO-FILL — generate a legal, scenario-appropriate force to the limit
   ===================================================================== */
function autoBuild(){
  const N = NATIONS[state.nation], nat = state.nation, C = sctx(), lim = effLimit();
  const defender = C.roleLabel === 'defender';
  const mobile   = (C.key==='breakthrough' && !defender) || C.key==='flank' || (C.key==='beachhead' && !defender);
  const armorLight = defender || C.key==='attrition';
  const cheapRifle = nat==='soviet' ? 16 : 20;
  state.items = [];

  const room = ()=> lim - totalCost();
  const push = (o)=>{ state.items.push(Object.assign({ uid:uid(), qty:1, slots:null, spec:null, transportId:null }, o)); };
  const addSquad = (id, spec)=> push({ defId:id, slots:defaultSlots(findDef(id).kind), spec:spec||null });
  const addUnit  = (id)=> push({ defId:id });
  const rifles   = ()=> state.items.filter(i=>findDef(i.defId).kind==='rifle');
  const freeRifle= ()=> rifles().find(i=>!i.spec);

  // 1 — command + two rifle squads (mandatory core)
  addSquad(nat+'_cmd');
  addSquad(nat+'_rifle');
  addSquad(nat+'_rifle');

  // 2 — support weapons
  if(room() >= 40) addUnit(nat+'_mg');
  if(room() >= 50 && !mobile) addUnit(nat+'_mortar');

  // 3 — anti-tank capability
  const atGun = N.guns.find(g=>srcEnabled(g.src));
  if(defender && atGun && room() >= atGun.pt + cheapRifle){ addUnit(atGun.id); }
  else if(freeRifle() && room() >= SPEC_BY_KEY.antitank.pt + 10){ freeRifle().spec = 'antitank'; }

  // 4 — scenario specials
  if(C.key==='demolition' && freeRifle() && room() >= SPEC_BY_KEY.demolition.pt + 10) freeRifle().spec = 'demolition';
  if(defender && freeRifle() && room() >= SPEC_BY_KEY.medic.pt + 20) freeRifle().spec = 'medic';
  if(mobile && freeRifle() && room() >= SPEC_BY_KEY.recon.pt + 20) freeRifle().spec = 'recon';

  // 5 — fortifications (defender only, within the scenario cap; kept modest)
  if(defender && C.fort > 0){
    let fb = Math.min(fortBudget(), Math.round(lim * 0.12));
    if(C.bunker && srcEnabled('Normandy') && fb >= 25 && room() > 25 + cheapRifle){ addUnit('f_bunker'); fb -= 25; }
    if(fb >= 15 && room() > 15 + cheapRifle){ addUnit('f_pillbox'); fb -= 15; }
    if(fb >= 8 && room() > 8 + cheapRifle){ addUnit('f_mines'); fb -= 8; }
    const maxEnt = Math.min(6, Math.max(2, Math.round(fb/5)));
    let ent = 0;
    while(ent < maxEnt && fb >= 5 && room() > 5 + cheapRifle){
      const ex = state.items.find(i=>i.defId==='f_entrench');
      if(ex) ex.qty++; else addUnit('f_entrench');
      fb -= 5; ent++;
    }
  }

  // 6 — greedy fill: keep buying the most useful legal thing until the
  //     points are (nearly) gone. Priority order reflects the scenario.
  const heavyCap  = nat==='germany' ? Math.max(1, Math.floor(lim/500)) : Math.max(1, Math.floor(lim/750));
  const vehSlots  = Math.max(1, Math.round(lim/250));
  const armorCap  = Math.round(lim * (armorLight ? 0.22 : mobile ? 0.30 : 0.42));
  let vehPool = N.vehicles.filter(v=>srcEnabled(v.src));
  if(mobile) vehPool = vehPool.filter(v=>v.class!=='heavy');
  if(nat==='japan') vehPool = vehPool.filter(v=>v.class!=='heavy');
  const tr = TRANSPORTS[nat].find(t=>srcEnabled(t.src));
  const trCost = tr ? (nat==='usa' ? Math.round(tr.pt*0.8) : tr.pt) : 9999;

  const vehItems = ()=> state.items.filter(i=>findDef(i.defId)._type==='vehicle');
  const vehCnt   = ()=> vehItems().reduce((a,i)=>a+(i.qty||1),0);
  const heavyCnt = ()=> vehItems().filter(i=>findDef(i.defId).class==='heavy').reduce((a,i)=>a+(i.qty||1),0);
  const armorPts = ()=> vehItems().reduce((a,i)=>a+itemCost(i),0);
  const sqCnt    = ()=> state.items.filter(i=>findDef(i.defId)._type==='squad').length;
  const teamCnt  = ()=> state.items.filter(i=>['mg','mortar'].includes(findDef(i.defId).kind)).length;
  const specCnt  = ()=> state.items.filter(i=>i.spec).length;
  const offCnt   = ()=> state.items.filter(i=>i.slots && i.slots.includes('officer')).length;
  const fortPts  = ()=> state.items.filter(i=>findDef(i.defId)._type==='fort').reduce((a,i)=>a+itemCost(i),0);
  const specWish = defender ? ['antitank','medic','engineer','expert','flamethrower','recon']
                            : ['flamethrower','antitank','recon','engineer','expert','medic'];
  const rifleCap = Math.max(6, Math.round(lim / 110));
  const teamCap  = Math.max(2, Math.round(lim / 500));

  let guard = 0;
  while(room() >= 4 && guard++ < 300){
    const r = room();
    const specCap = Math.max(3, Math.round(sqCnt() * 0.6));

    // a) weapon teams
    if(teamCnt() < teamCap && r >= 21){ addUnit(teamCnt()%2 ? nat+'_mg' : nat+'_mortar'); continue; }

    // b) another armored vehicle — strongest that still fits the armor budget
    if(vehCnt() < vehSlots && armorPts() < armorCap){
      const cand = vehPool
        .filter(v => v.pt <= r && v.pt <= lim/3 && armorPts()+v.pt <= armorCap && (v.class!=='heavy' || heavyCnt() < heavyCap))
        .sort((a,b)=> b.pt - a.pt);
      if(cand.length){ addUnit(cand[0].id); continue; }
    }

    // c) a specialization on a squad that has none
    const fr = freeRifle();
    if(fr && specCnt() < specCap){
      const sp = specWish.find(k => r >= SPEC_BY_KEY[k].pt + 4);
      if(sp){ fr.spec = sp; continue; }
    }

    // d) promote a regular to officer in a plain rifle squad (leadership spread)
    if(offCnt() < 3 && r >= 8){
      const sq = state.items.find(i=>{ const d=findDef(i.defId);
        return d.kind==='rifle' && i.slots && !i.slots.includes('officer') && i.slots.includes('regular'); });
      if(sq){ const idx = sq.slots.indexOf('regular'); sq.slots[idx] = 'officer';
        if(totalCost() > lim){ sq.slots[idx] = 'regular'; } else continue; }
    }

    // e) another squad — rifles first, then elite squads once rifles are plentiful
    if(r >= cheapRifle && rifles().length < rifleCap){ addSquad(nat+'_rifle'); continue; }
    if(r >= 36 && sqCnt() < rifleCap + 3){ addSquad(nat+'_elite'); continue; }

    // f) transport for a rifle squad without one (attackers / reserves first)
    if((mobile || C.reserves > 0) && tr){
      const rt = rifles().find(i=>!i.transportId);
      if(rt && r >= trCost){ rt.transportId = tr.id; continue; }
    }

    // g) upgrade a regular to elite (+4)
    const up = state.items.find(i=>{ const d=findDef(i.defId);
      return (d.kind==='rifle' || d.kind==='command') && i.slots && i.slots.includes('regular'); });
    if(up && r >= 4){
      const idx = up.slots.indexOf('regular'); up.slots[idx] = 'elite';
      if(totalCost() > lim){ up.slots[idx] = 'regular'; break; }
      continue;
    }

    // h) defender: another entrenchment inside the scenario cap
    if(defender && C.fort > 0 && r >= 5 && fortPts() + 5 <= fortBudget()){
      const ex = state.items.find(i=>i.defId==='f_entrench');
      if(ex) ex.qty++; else addUnit('f_entrench');
      continue;
    }

    break; // nothing left that helps
  }

  // 7 — burn any large remainder (big / asymmetric games)
  const burnVehCap = Math.max(vehSlots, Math.round(lim/180));
  guard = 0;
  while(room() >= 60 && vehCnt() < burnVehCap && guard++ < 24){
    const cand = vehPool
      .filter(v => v.pt <= room() && v.pt <= lim/3 && (v.class!=='heavy' || heavyCnt() < heavyCap))
      .sort((a,b)=> b.pt - a.pt);
    if(!cand.length) break;
    addUnit(cand[0].id);
  }
  guard = 0;
  while(room() >= 36 && sqCnt() < 40 && guard++ < 60){
    addSquad(nat + '_elite');
  }
  guard = 0;
  while(room() >= 4 && guard++ < 400){
    const up = state.items.find(i=>{ const d=findDef(i.defId);
      return (d.kind==='rifle' || d.kind==='command') && i.slots && i.slots.includes('regular'); });
    if(up){
      const idx = up.slots.indexOf('regular'); up.slots[idx] = 'elite';
      if(totalCost() > lim){ up.slots[idx] = 'regular'; break; }
      continue;
    }
    // no regulars left — promote an elite to officer where allowed (+4)
    const po = state.items.find(i=>{ const d=findDef(i.defId);
      return d.kind==='rifle' && i.slots && i.slots.includes('elite') && !i.slots.includes('officer'); });
    if(!po) break;
    const idx = po.slots.indexOf('elite'); po.slots[idx] = 'officer';
    if(totalCost() > lim){ po.slots[idx] = 'elite'; break; }
  }

  // safety — trim if somehow over
  while(totalCost() > lim){
    const i = state.items.map(x=>findDef(x.defId).kind).lastIndexOf('rifle');
    if(i < 0) break;
    state.items.splice(i, 1);
  }

  state.name = `${N.label} — ${C.name}${C.roleLabel?` (${C.roleLabel})`:''}`;
  state.cat = 'infantry';
  render();
}

function confirmAuto(){

  openDlg('Auto-fill force', `
    <p style="font-size:13.5px; color:var(--ink-soft); margin-top:0">
      Generate a legal force for <b>${NATIONS[state.nation].label}</b> in

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =====================================================================
   REVIEW SHEET
   ===================================================================== */
function figureCount(){
  let f = 0;
  state.items.forEach(it=>{
    const d = findDef(it.defId); if(!d || d._type!=='squad') return;
    if(d.kind==='mg'||d.kind==='mortar'){ f += 2; return; }
    f += it.slots.filter(s=>s && s!=='empty').length;
  });
  return f;
}
function compTile(n, l){ return `<div class="comp-tile"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

/* itemise every purchase inside one entry: figures, weapon crew,
   specialization token, transport, or a multi-model quantity. */
function purchaseLines(it, d){
  const out = [];
  if(d._type==='squad'){
    if(d.kind==='mg' || d.kind==='mortar'){
      out.push({ label:(d.kind==='mg'?'Machine gun crew':'Mortar crew')+' — '+d.stat, pts:(d.kind==='mg'?17:21) });
    } else {
      const c = {regular:0, elite:0, officer:0};
      it.slots.forEach(s=>{ if(c[s]!=null) c[s]++; });
      const rc = state.nation==='soviet' ? 4 : 5;
      if(c.regular) out.push({ label:`${c.regular} × Regular Infantry — ${FIG.regular.stat}`, pts:c.regular*rc });
      if(c.elite)   out.push({ label:`${c.elite} × Elite Infantry — ${FIG.elite.stat}`,       pts:c.elite*FIG.elite.cost });
      if(c.officer) out.push({ label:`${c.officer} × Officer — ${FIG.officer.stat}`,           pts:c.officer*FIG.officer.cost });
    }
    if(it.spec){ const sp = SPEC_BY_KEY[it.spec]; out.push({ label:`${sp.name} specialization — ${sp.rule}`, pts:sp.pt }); }
    if(it.transportId){
      const t = TRANSPORTS[state.nation].find(x=>x.id===it.transportId);
      if(t){ const tc = state.nation==='usa' ? Math.round(t.pt*0.8) : t.pt;
        out.push({ label:`Transport — ${esc(t.name)} · ${t.stat}`, pts:tc }); }
    }
  } else {
    const tier = d.tier && d.tier!=='core' ? ` · [${TIER_LABEL[d.tier]}]` : '';
    out.push({ label:`${d.stat}${tier}`, pts:d.pt });
    if((it.qty||1)>1) out.push({ label:`quantity ${it.qty} (× ${d.pt} pts)`, pts:d.pt*((it.qty||1)-1) });
  }
  return out;
}

function reviewRow(it){
  const d = findDef(it.defId);
  const cost = itemCost(it);
  let name = esc(d.name) + squadLabel(it, d);
  if(d._type!=='squad' && (it.qty||1)>1) name += ` ×${it.qty}`;
  const lines = purchaseLines(it, d).map(b=>
    `<div><span>${b.label}</span><span>${b.pts} pts</span></div>`).join('');
  return `<div class="sheet-row">
    <span class="nm">${name}</span>
    <span class="ct">${cost} pts</span>
    <div class="sheet-break">${lines}</div>
  </div>`;
}

function buildReview(){
  const el = $('#view-review');
  const N = NATIONS[state.nation], C = sctx(), lim = effLimit(), used = totalCost();
  const squads = state.items.filter(i=>findDef(i.defId)?._type==='squad');
  const teams  = squads.filter(i=>['mg','mortar'].includes(findDef(i.defId).kind)).length;
  const veh    = state.items.filter(i=>findDef(i.defId)?._type==='vehicle').reduce((a,i)=>a+(i.qty||1),0);
  const guns   = state.items.filter(i=>findDef(i.defId)?._type==='gun').reduce((a,i)=>a+(i.qty||1),0);
  const specs  = squads.filter(i=>i.spec).length;
  const trans  = squads.filter(i=>i.transportId).length;
  const checks = validate();
  const bad = checks.filter(c=>c.s==='fail').length;

  let h = `<div class="sheet">
    <div class="sheet-actions">
      <button id="pdfBtn" type="button">⬇ Save as PDF</button>
      <button id="reviewBack" type="button">Back to builder</button>
    </div>
    <div class="sheet-head">
      <h2>${esc(state.name)}</h2>
      <div class="sheet-meta">
        <span>${N.label}</span>
        <span>Doctrine · ${esc(N.doctrine.name)}</span>
        <span>${esc(C.name)}${C.roleLabel?` — ${C.roleLabel}`:''}</span>
        <span>${used} / ${lim} pts${lim!==state.limit?`  ·  base ${state.limit}`:''}</span>
        <span>Battle Builder v${APP_VERSION}</span>
      </div>
    </div>
    <div class="sheet-body">
      <div class="sheet-brief">
        <b>Deployment.</b> ${C.deploy}<br>
        <b>Victory.</b> ${C.vc}<br>
        ${C.reserves>0?`<b>Reserves.</b> ~${Math.round(C.reserves*100)}% (${Math.round(lim*C.reserves)} pts) start off the board.<br>`:''}
        ${C.fort>0
          ? `<b>Fortification.</b> up to ${fortBudget()} pts${C.freeEntrench?` + ${C.freeEntrench} free entrenchment(s)`:''}.`
          : `<b>Fortification.</b> not allowed in this scenario.`}
      </div>
      <div class="sheet-check">
        ${checks.map(c=>`<span class="check ${c.s}"><span class="dot ${c.s}"></span>${c.t}</span>`).join('')}
      </div>
      <div class="comp-tiles">
        ${compTile(squads.length-teams,'Squads')}
        ${compTile(teams,'Weapon teams')}
        ${compTile(figureCount(),'Figures')}
        ${compTile(veh,'Vehicles')}
        ${compTile(guns,'Guns')}
        ${compTile(specs,'Specializations')}
        ${compTile(trans,'Transports')}
      </div>`;

  const groups = { command:'Command', infantry:'Infantry', weapons:'Weapon Teams', vehicle:'Vehicles', gun:'Guns &amp; Emplacements', transport:'Transport', fort:'Fortifications' };
  const byGroup = {};
  state.items.forEach(it=>{ const d=findDef(it.defId); if(!d) return; (byGroup[d.cat||d._type] ||= []).push(it); });
  let any = false;
  for(const [gk,gl] of Object.entries(groups)){
    if(!byGroup[gk] || !byGroup[gk].length) continue;
    any = true;
    h += `<h3>${gl}</h3>`;
    for(const it of byGroup[gk]) h += reviewRow(it);
  }
  if(!any) h += `<p class="empty-note">No units yet — add some in the Builder.</p>`;

  h += `<div class="sheet-total"><span>Total${bad?` · ${bad} issue${bad>1?'s':''} to fix`:''}</span><span class="big">${used} / ${lim} pts</span></div>
      <p class="sheet-hint">To save a PDF: press <b>Save as PDF</b> (or Ctrl/⌘-P) and choose <b>Save as PDF</b> as the destination in your browser's print dialog.</p>
    </div></div>`;

  el.innerHTML = h;
  $('#pdfBtn').onclick = ()=> window.print();
  $('#reviewBack').onclick = ()=> switchView('build');
}

const TIER_LABEL = { core:'In the game', ext:'House rule', fan:'Fan' };
function refRows(arr, kind, showTier){
  return arr.map(u=>`<tr>
    <td>${u.name}</td>
    <td class="mono" style="font-size:13px">${u.stat||''}</td>
    <td class="src">${u.src}</td>
    ${showTier ? `<td class="src" style="color:${u.tier==='core'?'var(--ok)':u.tier==='fan'?'var(--oxide)':'var(--brass)'}">${TIER_LABEL[u.tier]||'In the game'}</td>` : ''}
    <td class="num">${u.pt!=null? u.pt : (kind==='squad'?'from '+ (u.kind==='command'?28:u.kind==='elite'?36:u.kind==='mg'?17:u.kind==='mortar'?21:20):'')}</td>
  </tr>`).join('');
}
function buildCompendium(){

  let h = '';

  h += `<section><h2>About this system</h2>
